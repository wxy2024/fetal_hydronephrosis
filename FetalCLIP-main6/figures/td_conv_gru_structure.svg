<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324d" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#34526f"/>
    </marker>
    <style>
      .title { font: 700 40px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#14324a; }
      .subtitle { font: 400 20px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#587086; }
      .section { font: 700 24px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#173b59; }
      .label { font: 700 21px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#18364d; }
      .small { font: 400 17px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#38566e; }
      .dim { font: 600 17px Consolas,'Microsoft YaHei',sans-serif; fill:#1d587d; }
      .note { font: 400 16px 'Microsoft YaHei','Noto Sans CJK SC',sans-serif; fill:#526b7c; }
      .arrow { stroke:#34526f; stroke-width:3; fill:none; marker-end:url(#arrow); }
      .dash { stroke:#829bad; stroke-width:2.5; stroke-dasharray:8 7; fill:none; marker-end:url(#arrow); }
    </style>
  </defs>

  <rect width="1800" height="1120" fill="url(#bg)"/>
  <text x="900" y="62" text-anchor="middle" class="title">TD-ConvGRU 模型结构图</text>
  <text x="900" y="96" text-anchor="middle" class="subtitle">多尺度局部时序模式提取 + 双向全局病程建模</text>

  <!-- Input -->
  <g filter="url(#shadow)">
    <rect x="60" y="180" width="250" height="170" rx="22" fill="#ffffff" stroke="#7fa9c7" stroke-width="3"/>
  </g>
  <text x="185" y="218" text-anchor="middle" class="section">患者随访序列</text>
  <rect x="88" y="242" width="52" height="62" rx="8" fill="#dcecff" stroke="#78a4c5"/>
  <rect x="158" y="242" width="52" height="62" rx="8" fill="#cde5ff" stroke="#78a4c5"/>
  <rect x="228" y="242" width="52" height="62" rx="8" fill="#bddcff" stroke="#78a4c5"/>
  <text x="114" y="279" text-anchor="middle" class="small">V₁</text>
  <text x="184" y="279" text-anchor="middle" class="small">V₂</text>
  <text x="254" y="279" text-anchor="middle" class="small">Vₜ</text>
  <text x="185" y="330" text-anchor="middle" class="dim">x: [B, T, 1542]</text>

  <path d="M310 265 H382" class="arrow"/>

  <!-- Input projection -->
  <g filter="url(#shadow)">
    <rect x="385" y="170" width="270" height="190" rx="22" fill="#eaf5ff" stroke="#4f91bf" stroke-width="3"/>
  </g>
  <text x="520" y="209" text-anchor="middle" class="section">输入特征投影</text>
  <text x="520" y="247" text-anchor="middle" class="small">LayerNorm</text>
  <text x="520" y="277" text-anchor="middle" class="small">Linear: 1542 → 512</text>
  <text x="520" y="307" text-anchor="middle" class="small">GELU + Dropout(0.3)</text>
  <text x="520" y="339" text-anchor="middle" class="dim">base: [B, T, 512]</text>

  <!-- Time conditioning -->
  <g filter="url(#shadow)">
    <rect x="385" y="420" width="270" height="168" rx="22" fill="#fff6da" stroke="#d4a73e" stroke-width="3"/>
  </g>
  <text x="520" y="459" text-anchor="middle" class="section">时间与阶段编码</text>
  <text x="520" y="493" text-anchor="middle" class="small">[间隔 delta, 阶段 phase]</text>
  <text x="520" y="524" text-anchor="middle" class="small">Linear 2→512→512</text>
  <text x="520" y="556" text-anchor="middle" class="dim">[B, T, 512]</text>

  <!-- Add node -->
  <circle cx="715" cy="265" r="38" fill="#ffffff" stroke="#557a97" stroke-width="3" filter="url(#shadow)"/>
  <text x="715" y="274" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#2d536f">+</text>
  <path d="M655 265 H674" class="arrow"/>
  <path d="M655 504 H690 V307" class="arrow"/>
  <text x="770" y="325" text-anchor="middle" class="dim">conditioned</text>
  <text x="770" y="347" text-anchor="middle" class="dim">[B,T,512]</text>

  <!-- Fan out -->
  <path d="M753 265 H790 V176 H845" class="arrow"/>
  <path d="M753 265 H845" class="arrow"/>
  <path d="M753 265 H790 V354 H845" class="arrow"/>

  <!-- branches -->
  <g filter="url(#shadow)">
    <rect x="848" y="125" width="285" height="102" rx="18" fill="#f2f5f8" stroke="#8298a8" stroke-width="2.5"/>
    <rect x="848" y="244" width="285" height="102" rx="18" fill="#e6f8ef" stroke="#54a77b" stroke-width="2.5"/>
    <rect x="848" y="363" width="285" height="102" rx="18" fill="#efeaff" stroke="#8170be" stroke-width="2.5"/>
  </g>
  <text x="990" y="163" text-anchor="middle" class="label">原始信息分支</text>
  <text x="990" y="195" text-anchor="middle" class="dim">conditioned [B,T,512]</text>
  <text x="990" y="282" text-anchor="middle" class="label">短期时间卷积</text>
  <text x="990" y="314" text-anchor="middle" class="small">深度可分离 Conv1D，k=3</text>
  <text x="990" y="401" text-anchor="middle" class="label">中期时间卷积</text>
  <text x="990" y="433" text-anchor="middle" class="small">深度可分离 Conv1D，k=5</text>

  <!-- Details box -->
  <rect x="830" y="510" width="320" height="154" rx="18" fill="#ffffff" stroke="#aab9c4" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="990" y="544" text-anchor="middle" class="label">每个卷积分支内部</text>
  <text x="990" y="578" text-anchor="middle" class="small">Depthwise Conv1D</text>
  <text x="990" y="605" text-anchor="middle" class="small">→ Pointwise Conv1D → GELU</text>
  <text x="990" y="632" text-anchor="middle" class="small">→ Dropout → 残差相加 → LayerNorm</text>
  <path d="M990 465 V505" class="dash"/>

  <!-- Concatenate -->
  <path d="M1133 176 H1198 V265 H1240" class="arrow"/>
  <path d="M1133 295 H1240" class="arrow"/>
  <path d="M1133 414 H1198 V325 H1240" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1243" y="206" width="245" height="178" rx="22" fill="#fff0e8" stroke="#d77b48" stroke-width="3"/>
  </g>
  <text x="1365" y="245" text-anchor="middle" class="section">局部特征融合</text>
  <text x="1365" y="281" text-anchor="middle" class="small">三路拼接</text>
  <text x="1365" y="309" text-anchor="middle" class="dim">512×3 = 1536</text>
  <text x="1365" y="338" text-anchor="middle" class="small">LN + Linear 1536→512</text>
  <text x="1365" y="365" text-anchor="middle" class="dim">enhanced [B,T,512]</text>

  <!-- GRU -->
  <path d="M1488 295 H1543" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1546" y="188" width="205" height="214" rx="26" fill="#e9edff" stroke="#586fc0" stroke-width="3"/>
  </g>
  <text x="1648" y="230" text-anchor="middle" class="section">双向 GRU</text>
  <text x="1648" y="267" text-anchor="middle" class="small">input_size = 512</text>
  <text x="1648" y="297" text-anchor="middle" class="small">hidden_size = 128</text>
  <text x="1648" y="327" text-anchor="middle" class="small">num_layers = 1</text>
  <text x="1648" y="362" text-anchor="middle" class="dim">正向128 + 反向128</text>
  <text x="1648" y="387" text-anchor="middle" class="dim">h_last: [B,256]</text>

  <!-- lower global flow -->
  <path d="M1648 402 V720 H1356" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="1115" y="676" width="240" height="154" rx="22" fill="#e9f9f5" stroke="#39a58b" stroke-width="3"/>
  </g>
  <text x="1235" y="715" text-anchor="middle" class="section">患者级病程表示</text>
  <text x="1235" y="754" text-anchor="middle" class="dim">[B, 256]</text>
  <text x="1235" y="788" text-anchor="middle" class="small">融合完整随访上下文</text>

  <path d="M1115 753 H1015" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="720" y="676" width="292" height="154" rx="22" fill="#fff4e2" stroke="#d59a3c" stroke-width="3"/>
  </g>
  <text x="866" y="714" text-anchor="middle" class="section">分类头</text>
  <text x="866" y="748" text-anchor="middle" class="small">LayerNorm + Dropout</text>
  <text x="866" y="778" text-anchor="middle" class="small">Linear 256→64 → ReLU</text>
  <text x="866" y="808" text-anchor="middle" class="small">Dropout + Linear 64→1</text>

  <path d="M720 753 H620" class="arrow"/>
  <g filter="url(#shadow)">
    <rect x="330" y="688" width="287" height="130" rx="25" fill="#ffe9eb" stroke="#cb6370" stroke-width="3"/>
  </g>
  <text x="473" y="730" text-anchor="middle" class="section">最终预测</text>
  <text x="473" y="768" text-anchor="middle" class="dim">logit: [B] → Sigmoid</text>
  <text x="473" y="797" text-anchor="middle" class="small">患者级二分类概率</text>

  <!-- Notes -->
  <rect x="60" y="910" width="1690" height="150" rx="24" fill="#ffffff" stroke="#c4d1db" stroke-width="2"/>
  <text x="90" y="950" class="section">读图要点</text>
  <circle cx="105" cy="987" r="6" fill="#4f91bf"/><text x="125" y="993" class="note">卷积负责发现相邻检查的局部变化；k=3 看短期，k=5 看更宽的中期窗口。</text>
  <circle cx="105" cy="1024" r="6" fill="#586fc0"/><text x="125" y="1030" class="note">BiGRU 负责汇总完整病程；当前实现没有显式计算 xₜ−xₜ₋₁，“TD”通过时间间隔编码和局部卷积体现。</text>
  <text x="1710" y="1030" text-anchor="end" class="note">当前配置：d_model=512，hidden=128，bidirectional=True</text>
</svg>
